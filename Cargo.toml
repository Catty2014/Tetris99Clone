[workspace]
resolver = "2"
members = [
    "crates/t99-core",
    "crates/t99-proto",
    "crates/t99-bots",
    "crates/t99-headless",
    "crates/t99-client",
    "crates/t99-server",
    "crates/t99-config",
    # 隐藏档外部 bot（Arena 公开包剔除本目录）
    "crates/t99-bot-m",
]
default-members = [
    "crates/t99-core",
    "crates/t99-proto",
    "crates/t99-bots",
    "crates/t99-headless",
    "crates/t99-server",
    "crates/t99-bot-m",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
debug = 1

[profile.release.package."*"]
debug = false
