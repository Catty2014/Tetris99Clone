# t99 规则集（只读陈述，不是运行时旋钮）
#
# id 必须与编译进 server / client / HeadlessClient 的 RULESET_ID 一致；
# 服务器 hello 与 ready 用它做精确匹配，不匹配立即拒绝。
# 阶段参数是当前调参基线，不追求与原版 T99 完全一致。
#
# 时间单位：
#   *_ticks = 逻辑帧（整数），按 tick_hz 换算
#   gravity_* = 毫格/秒

[ruleset]
id = "9f3c1a7e"             # 占位；正式值由 canonical ruleset 派生，DAS/ARR 移到 client 后需重新派生

tick_hz = 60                # 60 或 120；必须整除引擎时基
arr_ticks = 2               # 横向移动同方向最小间隔（帧）
board_width = 10
board_height = 20
hidden_rows = 4             # 允许 2..20

preview = 6
match_seconds = 900         # 99p 15min；0 = 按玩家人数自动

# 跨阶段不变量
bag_randomizer = true
srs = true
hold = true
irs = true
ihs = true
initial_trigger = "either"  # edge | held | either
allow_rot180 = false
death = "block"

# DAS/ARR are headed-client input timing (client.toml), not ruleset.
soft_milli_per_sec = 60000

lock_delay = "move"         # 移动重置
lock_delay_ticks = 30       # 500ms
lock_resets_max = 15

pending_cap_rows = 12
send_cap_rows = 20
p_same_hole_pct = 70
spawn_y_milli = 4000

combo_bonus = [0, 1, 1, 2, 2, 3, 3, 4, 4, 4, 5]
target_bonus = [0, 0, 1, 3, 5, 7, 9]
badge_tier_units = [2, 6, 14, 30]

# 阶段表：按 ratio_min_pm 降序；进入下一阶段的条件是存活比例低于阈值。
# are_ticks 取整数逻辑帧；当前为 100/100/83/67ms，后续调参可改。
[[ruleset.stage]]
ratio_min_pm = 500
gravity_base = 750
gravity_ramp_per_min = 120
gravity_cap = 1125
clear_delay_ticks = 18
are_ticks = 6
garbage_stage_ticks = 72

[[ruleset.stage]]
ratio_min_pm = 300
gravity_base = 1500
gravity_ramp_per_min = 400
gravity_cap = 2250
clear_delay_ticks = 15
are_ticks = 6
garbage_stage_ticks = 54

[[ruleset.stage]]
ratio_min_pm = 100
gravity_base = 3000
gravity_ramp_per_min = 1000
gravity_cap = 4500
clear_delay_ticks = 12
are_ticks = 5
garbage_stage_ticks = 39

[[ruleset.stage]]
ratio_min_pm = 0
gravity_base = 6000
gravity_ramp_per_min = 2000
gravity_cap = 60000
clear_delay_ticks = 9
are_ticks = 4
garbage_stage_ticks = 27
